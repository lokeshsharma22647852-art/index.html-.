<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>www.ShriBalajiIron.com</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07111f;
      --text: #f8fafc;
      --accent: #f59e0b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Poppins', Arial, sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background: radial-gradient(circle at top left, rgba(245,158,11,0.18), transparent 24%), linear-gradient(135deg, #030712, #07111f 45%, #12213a);
      color: var(--text);
      overflow: hidden;
    }
    .welcome-card {
      text-align: center;
      max-width: 620px;
      width: 100%;
      padding: 2.2rem;
      border-radius: 1.4rem;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.15);
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
      backdrop-filter: blur(10px);
    }
    .emoji {
      font-size: 5rem;
      display: inline-block;
      margin-bottom: 1rem;
      animation: handshake 1.4s ease-in-out infinite;
      filter: drop-shadow(0 8px 18px rgba(245, 158, 11, 0.25));
    }
    h1 {
      font-size: clamp(1.6rem, 3vw, 2.3rem);
      margin-bottom: 0.7rem;
      letter-spacing: 0.02em;
    }
    p {
      color: #cbd5e1;
      line-height: 1.7;
      margin-bottom: 1rem;
    }
    .enter-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 1.1rem;
      border-radius: 0.45rem;
      background: var(--accent);
      color: #111827;
      font-weight: 700;
      text-decoration: none;
      margin: 0.35rem 0 0.75rem;
    }
    .enter-link:focus-visible {
      outline: 3px solid #fef3c7;
      outline-offset: 3px;
    }
    .progress {
      width: 100%;
      height: 8px;
      background: rgba(255,255,255,0.12);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 1rem;
    }
    .progress span {
      display: block;
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, var(--accent), #ffd166);
      animation: load 2.2s ease forwards;
    }
    @keyframes handshake {
      0%, 100% { transform: scale(1) rotate(0deg); }
      25% { transform: scale(1.06) rotate(-4deg); }
      50% { transform: scale(1.12) rotate(0deg); }
      75% { transform: scale(1.06) rotate(4deg); }
    }
    @keyframes load {
      from { width: 0; }
      to { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="welcome-card" role="main">
    <div class="emoji" aria-hidden="true">🤝</div>
    <h1>Welcome to Shri Balaji Iron</h1>
    <p>Building strong relationships with trusted steel solutions for Jaipur and beyond.</p>
    <a class="enter-link" href="index,HTML.html">Enter site</a>
    <div class="progress" aria-hidden="true"><span></span></div>
  </main>
  <script>
    setTimeout(() => {
      window.location.href = 'index,HTML.html';
    }, 2200);
  </script>
</body>
</html>
